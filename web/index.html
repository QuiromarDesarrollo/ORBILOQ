<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="orbiloq_wms">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>orbiloq_wms</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="orbiloq-overlay" role="status" aria-label="Cargando ORBILOQ" style="position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;background:#fff;transition:opacity .3s ease">
    <div id="orbiloq-loader" style="width:min(260px,60vw)"></div>
    <p id="orbiloq-start-status" style="font:14px Arial,sans-serif;color:#1F5C8B">Iniciando ORBILOQ…</p>
  </div>
  <script src="orbiloq_loader.js"></script>
  <script>
    (function () {
      var loader = OrbiloqLoader.mount(document.getElementById('orbiloq-loader'), { mode: 'orbit' });
      var slow = setTimeout(function () {
        document.getElementById('orbiloq-start-status').textContent = 'La carga está tardando. Revisa tu conexión o recarga la página.';
      }, 45000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        loader.destroy();
        var overlay = document.getElementById('orbiloq-overlay');
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        setTimeout(function () { overlay.remove(); }, 300);
      }, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
