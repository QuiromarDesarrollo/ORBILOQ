name: orbiloq_wms
description: ORBILOQ WMS - Kardex maestro y control de bodega.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  supabase_flutter: ^2.8.0
  excel: ^4.0.6
  file_picker: ^8.1.6
  mobile_scanner: ^7.4.2
  pdf: ^3.12.0
  printing: ^5.14.3
  archive: ^3.6.1
  xml: ^6.6.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/logo_orbiloq.png
    - assets/images/logo_quiromar_lista.jpg
    - assets/images/logo_quiromar_formato.jpg
